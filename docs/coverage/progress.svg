<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="title desc">
<title id="title">Cobertura das cartas do YugiRE</title>
<desc id="desc">Catálogo: 1114 cartas. Onze anotadas, nove parcialmente implementadas, zero integralmente validadas.</desc>
<rect width="680" height="270" fill="#f8fafc"/>
<text x="24" y="32" fill="#0f172a" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Cobertura por carta</text>
<text x="24" y="54" fill="#475569" font-family="Arial,sans-serif" font-size="13">1.114 registros catalogados — não mede jogabilidade</text>
<text x="24" y="86" fill="#0f172a" font-family="Arial,sans-serif" font-size="14">Anotadas</text>
<text x="646" y="86" fill="#0f172a" font-family="Arial,sans-serif" font-size="14" text-anchor="end">11 / 1114 (0.99%)</text>
<rect x="24" y="96" width="620" height="13" fill="#e2e8f0" rx="6"/>
<rect x="24" y="96" width="6.122" height="13" fill="#2563eb" rx="2"/>
<text x="24" y="144" fill="#0f172a" font-family="Arial,sans-serif" font-size="14">Implementação parcial</text>
<text x="646" y="144" fill="#0f172a" font-family="Arial,sans-serif" font-size="14" text-anchor="end">9 / 1114 (0.81%)</text>
<rect x="24" y="154" width="620" height="13" fill="#e2e8f0" rx="6"/>
<rect x="24" y="154" width="5.009" height="13" fill="#2563eb" rx="2"/>
<text x="24" y="202" fill="#0f172a" font-family="Arial,sans-serif" font-size="14">Validadas integralmente</text>
<text x="646" y="202" fill="#0f172a" font-family="Arial,sans-serif" font-size="14" text-anchor="end">0 / 1114 (0.00%)</text>
<rect x="24" y="212" width="620" height="13" fill="#e2e8f0" rx="6"/>
<rect x="24" y="212" width="0.000" height="13" fill="#2563eb" rx="2"/>
</svg>
