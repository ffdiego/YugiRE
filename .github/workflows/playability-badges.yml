name: Publish project coverage badges

on:
  push:
    branches: [main]
    paths:
      - 'docs/cards/playability-manifest.json'
      - 'docs/cards/pack-index.json'
      - 'docs/cards/monster-subtypes.json'
      - 'scripts/publish_playability.py'
      - 'docs/architecture/visual-function-coverage.json'
      - 'docs/architecture/native-renderer-inventory.md'
      - 'scripts/publish_visual_coverage.py'
      - '.github/workflows/playability-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yugire-playability-badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute sandbox progress
        run: python scripts/publish_playability.py
      - name: Recompute visual function coverage
        run: python scripts/publish_visual_coverage.py
      - name: Publish updated progress files if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/cards/PLAYABILITY.md docs/cards/badges/ docs/architecture/VISUAL_COVERAGE.md docs/architecture/badges/
          if git diff --cached --quiet; then
            echo "Badge counts already up-to-date"
            exit 0
          fi
          git commit -m "docs(cards): refresh playability badges [skip ci]"
          git push origin HEAD:main
