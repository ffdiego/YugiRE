name: YugiRE synthetic lab checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-lab-synthetic:
    name: Python and Node offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Coverage fixtures read a pinned historical git commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Joey.Coverage for pinned-fixture tests
        run: dotnet build src/Joey.Coverage/Joey.Coverage.csproj --configuration Debug
      - name: YugiLab offline checks
        run: python -m unittest discover -s yugilab/tests -p 'test_*.py' -v
      - name: Native capture and deck offline checks
        run: python -m unittest discover -s native_hooks/tests -p 'test_*.py' -v
      - name: Repository Python offline checks (untracked hybrid experiments optional)
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            case "$test" in
              tests/test_joey_compare_ydr.py)
                if [[ ! -f experiments/hybrid_probe/compare_ydr.py ]]; then
                  echo "::notice::Skipping $test: experiments/hybrid_probe/compare_ydr.py is not versioned in this checkout"
                  continue
                fi
                ;;
              tests/test_joey_hybrid_preflight.py)
                if [[ ! -f experiments/hybrid_probe/pe_preflight.py ]]; then
                  echo "::notice::Skipping $test: experiments/hybrid_probe/pe_preflight.py is not versioned in this checkout"
                  continue
                fi
                ;;
            esac
            python -m unittest discover -s tests -p "$(basename "$test")" -v
          done
      - name: Native state sampler JavaScript tests
        run: node native_hooks/tests/test_native_state_sampler.cjs
      - name: Native computed battle attributes JavaScript tests
        run: node native_hooks/tests/test_native_battle_attributes.cjs
      - name: Native command listener mock integration
        run: node native_hooks/tests/test_loader.cjs

  csharp-sandbox:
    name: .NET 10 build and synthetic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Coverage fixtures read a pinned historical git commit
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build full solution
        run: dotnet build YugiRE.sln --configuration Release
      - name: Execute Joey.Tests fixture suite
        run: dotnet run --project src/tests/Joey.Tests --configuration Release --no-build
      - name: Check graphical laboratory startup without DAT or display
        run: dotnet run --project src/Joey.App --configuration Release --no-build -- --check-console-startup
